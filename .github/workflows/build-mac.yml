name: 构建 macOS 安装包

# ============================================================
#  两种触发方式：
#  1. 手动：GitHub 仓库页面 → Actions → "构建 macOS 安装包"
#     → Run workflow，可选 arm64 / x64 / 两个都打
#  2. 标签：推送 v 开头的标签（如 v0.1.0）自动构建并发布 Release
#
#  架构说明（踩坑结论）：
#  - arm64 包在 macos-14（Apple 芯片）上原生构建
#  - x64 包必须在 macos-13（Intel 芯片）上原生构建：
#    曾尝试在 arm64 runner 上用 `npm install --cpu=x64` 交叉安装，
#    koffi 的安装脚本忽略 cpu 参数回退源码编译，链接失败。
#  - electron-builder 必须带 --publish never，否则它在 CI 中
#    隐式触发 GitHub 发布并因缺少 GH_TOKEN 而失败。
# ============================================================
on:
  workflow_dispatch:
    inputs:
      arch:
        description: 目标架构（M1/M2/M3/M4 选 arm64，Intel 选 x64，不确定选 both）
        type: choice
        options:
          - both
          - arm64
          - x64
        default: both
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-arm64:
    name: 打包 dmg (arm64 / Apple 芯片)
    if: github.event_name == 'push' || github.event.inputs.arch == 'both' || github.event.inputs.arch == 'arm64'
    runs-on: macos-14
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: npm install

      - name: 生成 dmg（不签名、不发布）
        run: ./node_modules/.bin/electron-builder --mac dmg --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传构建产物（Actions 页面可下载，保留 14 天）
        uses: actions/upload-artifact@v4
        with:
          name: 日程侧边栏-mac-arm64
          path: dist/*.dmg
          retention-days: 14
          if-no-files-found: error

      - name: 附加到 GitHub Release（仅 v* 标签触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true

  build-x64:
    name: 打包 dmg (x64 / Intel 芯片)
    if: github.event_name == 'push' || github.event.inputs.arch == 'both' || github.event.inputs.arch == 'x64'
    runs-on: macos-13
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖（Intel 原生）
        run: npm install

      - name: 生成 dmg（不签名、不发布）
        run: ./node_modules/.bin/electron-builder --mac dmg --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: 上传构建产物（Actions 页面可下载，保留 14 天）
        uses: actions/upload-artifact@v4
        with:
          name: 日程侧边栏-mac-x64
          path: dist/*.dmg
          retention-days: 14
          if-no-files-found: error

      - name: 附加到 GitHub Release（仅 v* 标签触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
